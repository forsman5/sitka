name: Deploy to gamedev-server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # Matches runnerScaleSetName in homelab-infra's gamedev runner release.
    runs-on: sitka
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true

      - name: Export web build
        run: |
          mkdir -p exports/web
          godot --headless --import
          godot --headless --export-release "Web" exports/web/index.html
          test -f exports/web/index.html

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mkdir -p "$HOME/bin"
          mv kubectl "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Copy build onto gamedev-server
        run: |
          POD=$(kubectl -n gamedev get pod -l app.kubernetes.io/name=gamedev-server -o jsonpath='{.items[0].metadata.name}')
          test -n "$POD"
          kubectl -n gamedev exec "$POD" -- mkdir -p /app/exports/web/sitka
          tar -C exports/web -cf - . | kubectl -n gamedev exec -i "$POD" -- tar -xf - -C /app/exports/web/sitka
