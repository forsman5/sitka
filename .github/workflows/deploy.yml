name: Deploy to gamedev-server

on:
  push:
    branches: [master]
  workflow_dispatch:

# Two pushes must not swap the same destination at once; queue instead of cancelling.
concurrency:
  group: deploy-sitka
  cancel-in-progress: false

jobs:
  deploy:
    # Matches runnerScaleSetName in homelab-infra's gamedev runner release.
    runs-on: sitka
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-web
        with:
          dest: sitka
